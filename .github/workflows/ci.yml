name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Run non-container tests with coverage
        run: go test ./internal/... ./cmd/... -covermode=atomic -coverprofile=coverage.out
      - name: Report coverage
        run: |
          {
            echo '## Non-container coverage'
            echo '```text'
            go tool cover -func=coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  contracts:
    name: Contracts and docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Set up protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "33.4"
          repo-token: ${{ github.token }}
      - name: Install protobuf generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Check generated protobufs
        run: ./scripts/generate-proto.sh --check
      - name: Validate documentation and issue forms
        run: go run ./tools/ci validate
      - name: Validate workflow semantics
        run: actionlint

  race:
    name: Race
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run race detector
        run: go test -race ./internal/... ./cmd/...

  integration:
    name: Testcontainers and migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run Testcontainers and migration suite with race detector
        env:
          TESTCONTAINERS_RYUK_DISABLED: "false"
        run: go test -race -count=1 -timeout=20m ./test/...
