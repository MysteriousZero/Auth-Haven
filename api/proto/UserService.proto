syntax = "proto3";

package auth;
option go_package = "auth-haven/pkg/proto";
import "common/Tokens.proto";  // <-- import the file that has Tokens

service UserService {
  rpc CreatePersonalUser(CreatePersonalUserRequest) returns (RegisterResponse);
  rpc CreateCompanyAndOwner(CreateCompanyAndOwnerRequest) returns (RegisterResponse);
}

message CreatePersonalUserRequest {
  string email = 1;
  string password = 2;
  string full_name = 3;
}

message CreateCompanyAndOwnerRequest {
  string company_name = 1;
  string company_domain = 2;
  string owner_email = 3;
  string owner_password = 4;
  string owner_full_name = 5;
}

// Registration response with user info
message RegisterResponse {
  User user = 1;
}

// User model as specified in the domain models
message User {
  string user_id = 1;
  string tenant_id = 2;
  string email = 3;
  string full_name = 4;
  string status = 5;
  int64 role_id = 6;
  string created_at = 7;
  string updated_at = 8;
}